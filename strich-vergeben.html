<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Strich vergeben – Estermann AG</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, Arial, sans-serif; background: #0f1117; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
.header { text-align: center; padding: 1.2rem 1rem 0.8rem; border-bottom: 0.5px solid #2a2d3a; }
.header h1 { font-size: 1.2rem; font-weight: 600; }
.header p { font-size: 0.8rem; color: #555; margin-top: 4px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px; flex: 1; }
.card { background: #1a1d27; border: 1.5px solid #2a2d3a; border-radius: 16px; padding: 1.2rem 0.8rem 1rem; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.card.danger { border-color: #e24b4a; box-shadow: 0 0 20px rgba(226,75,74,0.25); }
.av { width: 110px; height: 110px; border-radius: 50%; overflow: hidden; border: 2px solid #2a2d3a; flex-shrink: 0; }
.card.danger .av { border-color: #e24b4a; }
.av img { width: 100%; height: 100%; object-fit: cover; object-position:center center; }
.name { font-size: 1.25rem; font-weight: 700; }
.striche-row { display: flex; gap: 5px; justify-content: center; min-height: 28px; align-items: center; flex-wrap: wrap; }
.sm { width: 10px; height: 28px; background: #e24b4a; border-radius: 2px; }
.sleer { font-size: 0.75rem; color: #555; }
.beer-badge { background: #FAC775; color: #412402; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
.btn-row { display: flex; gap: 8px; width: 100%; margin-top: 2px; }
.btn-minus { height: 48px; width: 48px; flex-shrink: 0; background: transparent; border: 1px solid #3a3d4a; color: #888; border-radius: 10px; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
.btn-minus:active { background: #2a2d3a; }
.btn-plus { flex: 1; height: 48px; background: transparent; border: 1px solid #e24b4a; color: #e24b4a; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.btn-plus:active { background: rgba(226,75,74,0.15); }
.footer { text-align: center; padding: 10px; font-size: 11px; color: #333; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #555; margin-right: 4px; vertical-align: middle; }
.dot.ok { background: #1D9E75; }
.dot.err { background: #e24b4a; }
.dot.spin { background: #FAC775; animation: p 0.8s ease-in-out infinite; }
@keyframes p { 0%,100%{opacity:1;}50%{opacity:0.2;} }
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #1a1d27; border: 0.5px solid #3a3d4a; color: #fff; border-radius: 30px; padding: 10px 24px; font-size: 0.85rem; font-weight: 500; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200; white-space: nowrap; }
.toast.show { opacity: 1; }
.toast.red { background: #e24b4a; border-color: #e24b4a; }
.setup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.setup-box { background: #1a1d27; border: 0.5px solid #2a2d3a; border-radius: 16px; padding: 1.5rem; width: 100%; max-width: 360px; }
.setup-box h2 { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
.setup-box p { font-size: 12px; color: #888; margin-bottom: 16px; line-height: 1.5; }
.slbl { font-size: 11px; color: #888; margin-bottom: 4px; }
.sinput { width: 100%; background: #0f1117; border: 0.5px solid #3a3d4a; border-radius: 8px; padding: 10px 12px; color: #fff; font-size: 0.8rem; outline: none; font-family: monospace; margin-bottom: 10px; }
.sbtn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #185FA5; color: #fff; font-size: 0.9rem; font-weight: 500; cursor: pointer; }
.smsg { font-size: 12px; margin-top: 8px; text-align: center; }
</style>
</head>
<body>

<div class="header">
  <h1>Strich vergeben</h1>
  <p>Estermann AG &nbsp;&middot;&nbsp; 3 Striche = Nachtessen &amp; Bier</p>
</div>

<div class="grid" id="grid"></div>

<div class="footer">
  <span class="dot spin" id="sdot"></span><span id="stxt">Verbinde...</span>
</div>

<div class="toast" id="toast"></div>

<div class="setup-overlay" id="setup-overlay" style="display:none;">
  <div class="setup-box">
    <h2>Strich vergeben</h2>
    <p>Nur f&uuml;r Mitarbeitende der Estermann AG.<br>Bitte Passwort eingeben (einmalig pro Ger&auml;t).</p>
    <input class="sinput" id="sb-key" type="password" placeholder="Passwort" onkeydown="if(event.key==='Enter')doSetup()" />
    <button class="sbtn" onclick="doSetup()">Freischalten</button>
    <div class="smsg" id="smsg"></div>
  </div>
</div>

<script>
var PH={},PHLOADED=false;
var SB_DEFAULT_URL='https://ywidauutzknomyjcyuho.supabase.co';
var SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3aWRhdXV0emtub215amN5dWhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNDAzMTksImV4cCI6MjA5MTkxNjMxOX0.p4CYCFBGmmItA2AhCznFV7hlwmmkjb-mbt6fsbDdXIs';
var data=[{name:'Enea',striche:0},{name:'Levin',striche:0},{name:'Noah',striche:0},{name:'Sandro',striche:0}];
var SB_URL='', SB_KEY='';

function loadCreds(){ var m=/[#&]pw=([^&]*)/.exec(location.hash);if(m){try{localStorage.setItem('sb_pw',decodeURIComponent(m[1]));}catch(e){}try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
  SB_URL=SB_DEFAULT_URL; SB_KEY=localStorage.getItem('sb_pw')||''; localStorage.removeItem('sb_key'); localStorage.removeItem('sb_url'); }
function saveCreds(u,k){ localStorage.setItem('sb_pw',k); SB_URL=u; SB_KEY=k; }
function setSS(state,msg){ document.getElementById('sdot').className='dot '+state; document.getElementById('stxt').textContent=msg; }

function render(){
  var g='';
  for(var i=0;i<data.length;i++){
    var l=data[i], danger=l.striche>=3;
    var sh=l.striche===0?'<span class="sleer">keine Striche</span>':Array(l.striche).fill('<div class="sm"></div>').join('');
    g+='<div class="card'+(danger?' danger':'')+'" id="card-'+i+'">'
      +'<div class="av">'+(PH[l.name]?'<img src="'+PH[l.name]+'" alt="'+l.name+'">':'<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#2a2d3a;color:#555;font-size:2.6rem;font-weight:600;">'+l.name.charAt(0)+'</div>')+'</div>'
      +'<div class="name">'+l.name+'</div>'
      +'<div class="striche-row">'+sh+'</div>'
      +(danger?'<div class="beer-badge">Bier! &#127866;</div>':'')
      +'<div class="btn-row">'
      +'<button class="btn-minus" onclick="sub('+i+')">&#8722;</button>'
      +'<button class="btn-plus" onclick="add('+i+')">+ Strich</button>'
      +'</div>'
      +'</div>';
  }
  document.getElementById('grid').innerHTML=g;
}

async function rpc(fn,args){
  return fetch(SB_DEFAULT_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},body:JSON.stringify(args)});
}

async function loadPhotos(){
  var res=await rpc('liste',{p:SB_KEY,mit_foto:true});
  if(!res.ok)throw new Error(res.status);
  var rows=await res.json();
  rows.forEach(function(r){if(r.foto)PH[r.name]=r.foto;});
  PHLOADED=true;
}
function showLock(msg){
  document.getElementById('setup-overlay').style.display='flex';
  document.getElementById('grid').innerHTML='';
  if(msg){var m=document.getElementById('smsg');m.style.color='#e24b4a';m.textContent=msg;}
}
async function loadCloud(){
  if(!SB_KEY)return;
  setSS('spin','Lade...');
  try{
    if(!PHLOADED)await loadPhotos();
    var res=await rpc('liste',{p:SB_KEY,mit_foto:false});
    if(res.status===401||res.status===403)throw new Error('403');
    if(!res.ok)throw new Error(res.status);
    var rows=await res.json();
    if(rows&&rows.length>0){
      data=rows.map(function(r){return{name:r.name,striche:r.anzahl};});
      render();
      setSS('ok','Bereit');
    }
  }catch(e){
    if(String(e.message)==='403'||String(e.message)==='401'){localStorage.removeItem('sb_pw');SB_KEY='';showLock('Passwort falsch');}
    else setSS('err','Sync fehlgeschlagen');
  }
}

async function saveOne(i){
  setSS('spin','Speichert...');
  try{
    var res=await rpc('setze',{p:SB_KEY,n:data[i].name,a:data[i].striche});
    if(!res.ok)throw new Error(res.status);
    setSS('ok','Gespeichert');
  }catch(e){ setSS('err','Fehler beim Speichern'); }
}

function add(i){
  data[i].striche++;
  render();
  var n=data[i].name, c=data[i].striche;
  showToast('+1 Strich: '+n+' ('+c+')', c>=3);
  saveOne(i);
}

function sub(i){
  if(data[i].striche<=0){ showToast(data[i].name+' hat keine Striche', false); return; }
  data[i].striche--;
  render();
  showToast('Strich entfernt: '+data[i].name, false);
  saveOne(i);
}

async function doSetup(){
  var key=document.getElementById('sb-key').value.trim();
  var msg=document.getElementById('smsg');
  msg.style.color='#FAC775'; msg.textContent='Pr\u00fcfe...';
  try{
    var res=await rpc('liste',{p:key,mit_foto:false});
    if(!res.ok)throw new Error('Passwort falsch');
    saveCreds(SB_DEFAULT_URL,key);
    location.reload();
  }catch(e){ msg.style.color='#e24b4a'; msg.textContent=e.message; }
}

function showToast(msg, red){
  var t=document.getElementById('toast');
  t.innerHTML=msg;
  t.className='toast'+(red?' red':'')+' show';
  setTimeout(function(){t.classList.remove('show');},2500);
}

loadCreds();
render();
if(!SB_KEY){
  document.getElementById('setup-overlay').style.display='flex';
  setSS('','Nicht verbunden');
}else{
  loadCloud();
  setInterval(loadCloud,15000);
}
</script>
</body>
</html>
